<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEX ORBIT // Yörünge Hayatta Kalma</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: none !important;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050a;
      font-family: 'Segoe UI', 'Roboto', 'Orbitron', monospace, sans-serif;
      color: #ffffff;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    (() => {
      "use strict";

      // Fare ve sağ tık etkileşimini tamamen devre dışı bırak
      const blockMouse = (e) => {
        e.preventDefault();
        e.stopPropagation();
        return false;
      };
      ["mousedown", "mouseup", "mousemove", "click", "dblclick", "contextmenu", "wheel"].forEach(evt => {
        window.addEventListener(evt, blockMouse, { passive: false, capture: true });
      });

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      // ==========================================
      // LOCALSTORAGE YÖNETİMİ
      // ==========================================
      const STORAGE_SCORE_KEY = "hex_orbit_best_score";
      const STORAGE_TIME_KEY = "hex_orbit_best_time";

      let bestScore = parseInt(localStorage.getItem(STORAGE_SCORE_KEY) || "0", 10);
      let bestTime = parseFloat(localStorage.getItem(STORAGE_TIME_KEY) || "0");

      function saveRecords(score, time) {
        let isNewBestScore = false;
        let isNewBestTime = false;
        if (score > bestScore) {
          bestScore = Math.floor(score);
          localStorage.setItem(STORAGE_SCORE_KEY, String(bestScore));
          isNewBestScore = true;
        }
        if (time > bestTime) {
          bestTime = time;
          localStorage.setItem(STORAGE_TIME_KEY, bestTime.toFixed(2));
          isNewBestTime = true;
        }
        return { isNewBestScore, isNewBestTime };
      }

      // ==========================================
      // WEB AUDIO API SYNTH SES MOTORU
      // ==========================================
      const AudioEngine = {
        ctx: null,
        masterGain: null,
        initialized: false,

        init() {
          if (this.initialized) {
            if (this.ctx && this.ctx.state === "suspended") {
              this.ctx.resume();
            }
            return;
          }
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = 0.35;
          this.masterGain.connect(this.ctx.destination);
          this.initialized = true;
        },

        playBeat(intensity = 1, step = 0) {
          if (!this.initialized || !this.ctx) return;
          const now = this.ctx.currentTime;

          // Derin Kick / Synth Pulse
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(115, now);
          osc.frequency.exponentialRampToValueAtTime(36, now + 0.14);

          gain.gain.setValueAtTime(0.55 * intensity, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.19);

          // Bas arpej notası (synthwave havası)
          const bassNotes = [55, 55, 65.41, 73.42, 55, 55, 82.41, 65.41];
          const bassFreq = bassNotes[step % bassNotes.length];
          const bOsc = this.ctx.createOscillator();
          const bFilter = this.ctx.createBiquadFilter();
          const bGain = this.ctx.createGain();

          bOsc.type = "sawtooth";
          bOsc.frequency.setValueAtTime(bassFreq, now);
          bFilter.type = "lowpass";
          bFilter.frequency.setValueAtTime(480 + intensity * 240, now);
          bFilter.frequency.exponentialRampToValueAtTime(120, now + 0.22);

          bGain.gain.setValueAtTime(0.18 * intensity, now);
          bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

          bOsc.connect(bFilter);
          bFilter.connect(bGain);
          bGain.connect(this.masterGain);
          bOsc.start(now);
          bOsc.stop(now + 0.25);
        },

        playGraze(multiplier) {
          if (!this.initialized || !this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          const baseFreq = 620 + Math.min(multiplier, 10) * 85;
          osc.type = "sine";
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.65, now + 0.09);

          osc2.type = "triangle";
          osc2.frequency.setValueAtTime(baseFreq * 1.5, now);
          osc2.frequency.exponentialRampToValueAtTime(baseFreq * 2.1, now + 0.09);

          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

          osc.connect(gain);
          osc2.connect(gain);
          gain.connect(this.masterGain);

          osc.start(now);
          osc2.start(now);
          osc.stop(now + 0.12);
          osc2.stop(now + 0.12);
        },

        playStart() {
          if (!this.initialized || !this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [220, 329.63, 440, 659.25];
          notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sawtooth";
            const t = now + i * 0.045;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.16, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);

            const filter = this.ctx.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(2200, t);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(this.masterGain);
            osc.start(t);
            osc.stop(t + 0.2);
          });
        },

        playCrash() {
          if (!this.initialized || !this.ctx) return;
          const now = this.ctx.currentTime;

          // Gürültü patlaması
          const bufferSize = this.ctx.sampleRate * 0.45;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.12));
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(1600, now);
          filter.frequency.exponentialRampToValueAtTime(90, now + 0.42);

          const nGain = this.ctx.createGain();
          nGain.gain.setValueAtTime(0.65, now);
          nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

          noise.connect(filter);
          filter.connect(nGain);
          nGain.connect(this.masterGain);
          noise.start(now);

          // Düşen synth bas
          const osc = this.ctx.createOscillator();
          const oGain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(170, now);
          osc.frequency.exponentialRampToValueAtTime(24, now + 0.5);

          oGain.gain.setValueAtTime(0.45, now);
          oGain.gain.exponentialRampToValueAtTime(0.001, now + 0.52);

          osc.connect(oGain);
          oGain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.53);
        }
      };

      // ==========================================
      // OYUN SABİTLERİ VE DURUMU
      // ==========================================
      const SIDES = 6;
      const SECTOR_ANGLE = (Math.PI * 2) / SIDES;
      const CORE_RADIUS = 44;
      const ORBIT_RADIUS = 76;
      const PLAYER_SPEED = 7.0; // radyan / saniye
      const GRAZE_ANGLE_THRESHOLD = 0.24; // ~13.7 derece kenar teğet alanı

      const STATE = {
        MENU: 0,
        PLAYING: 1,
        GAMEOVER: 2
      };

      let gameState = STATE.MENU;
      let width = 0;
      let height = 0;
      let maxRadius = 800;

      // Tuşlar
      const keys = {
        left: false,
        right: false
      };

      // Oyun Değişkenleri
      let playerAngle = -Math.PI / 2;
      let playerTrail = [];
      let survivalTime = 0;
      let score = 0;
      let multiplier = 1.0;
      let multiplierTimer = 0; // Combo süresi (saniye)
      const MULTIPLIER_DURATION = 3.2;

      let walls = [];
      let particles = [];
      let floatingTexts = [];
      let grazeRings = [];

      // Dünya & Kamera Dinamikleri
      let worldRotation = 0;
      let worldRotSpeed = 0.45;
      let rotDirection = 1;
      let rotSwitchTimer = 6;
      let cameraTiltPhase = 0;
      let hue = 190;
      let shakeIntensity = 0;
      let flashAlpha = 0;

      // Ritim & Nabız
      let beatTimer = 0;
      let beatStep = 0;
      let pulse = 0;

      // Duvar Oluşturma
      let spawnTimer = 0;
      let lastGapSector = 0;
      let patternQueue = [];

      // Rekor bayrakları
      let newRecordFlags = { isNewBestScore: false, isNewBestTime: false };
      let gameOverTimer = 0;

      // ==========================================
      // YARDIMCI FONKSİYONLAR
      // ==========================================
      function normalizeAngle(a) {
        const twoPi = Math.PI * 2;
        return ((a % twoPi) + twoPi) % twoPi;
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        maxRadius = Math.hypot(width * 0.5, height * 0.5) + 120;
      }
      window.addEventListener("resize", resize);
      resize();

      // ==========================================
      // GİRDİ KONTROLÜ (SADECE KLAVYE)
      // ==========================================
      window.addEventListener("keydown", (e) => {
        if (e.code === "ArrowLeft" || e.code === "KeyA") {
          keys.left = true;
        } else if (e.code === "ArrowRight" || e.code === "KeyD") {
          keys.right = true;
        } else if (e.code === "Space") {
          e.preventDefault();
          if (gameState === STATE.MENU) {
            startGame();
          } else if (gameState === STATE.GAMEOVER && gameOverTimer > 0.35) {
            startGame();
          }
        }
      });

      window.addEventListener("keyup", (e) => {
        if (e.code === "ArrowLeft" || e.code === "KeyA") {
          keys.left = false;
        } else if (e.code === "ArrowRight" || e.code === "KeyD") {
          keys.right = false;
        }
      });

      // ==========================================
      // OYUN AKIŞI VE DUVAR DESENLERİ
      // ==========================================
      function startGame() {
        AudioEngine.init();
        AudioEngine.playStart();

        gameState = STATE.PLAYING;
        playerAngle = -Math.PI / 2;
        playerTrail = [];
        survivalTime = 0;
        score = 0;
        multiplier = 1.0;
        multiplierTimer = 0;

        walls = [];
        particles = [];
        floatingTexts = [];
        grazeRings = [];
        patternQueue = [];

        worldRotation = 0;
        worldRotSpeed = 0.5;
        rotDirection = 1;
        rotSwitchTimer = 6.5;
        cameraTiltPhase = 0;
        shakeIntensity = 0;
        flashAlpha = 0.25;

        beatTimer = 0;
        beatStep = 0;
        pulse = 1.0;

        spawnTimer = 0.3;
        lastGapSector = Math.floor(Math.random() * SIDES);
        newRecordFlags = { isNewBestScore: false, isNewBestTime: false };
      }

      function enqueuePattern() {
        const difficulty = Math.min(1, survivalTime / 55);
        const type = Math.random();

        if (type < 0.32) {
          // Spiral (3-4 ardışık duvar birer adım kayar)
          const dir = Math.random() < 0.5 ? 1 : -1;
          const count = 3 + Math.floor(Math.random() * 2);
          for (let i = 0; i < count; i++) {
            lastGapSector = (lastGapSector + dir + SIDES) % SIDES;
            const gaps = new Array(SIDES).fill(false);
            gaps[lastGapSector] = true;
            patternQueue.push({ gaps, delayFactor: 0.88 - difficulty * 0.12 });
          }
        } else if (type < 0.58) {
          // Çift Karşılıklı Boşluk + Tek Boşluk Alternatifi
          const s1 = (lastGapSector + (Math.random() < 0.5 ? 1 : -1) + SIDES) % SIDES;
          const gaps1 = new Array(SIDES).fill(false);
          gaps1[s1] = true;
          gaps1[(s1 + 3) % SIDES] = true;
          patternQueue.push({ gaps: gaps1, delayFactor: 1.0 });

          const s2 = (s1 + 1 + Math.floor(Math.random() * 2)) % SIDES;
          const gaps2 = new Array(SIDES).fill(false);
          gaps2[s2] = true;
          gaps2[(s2 + 3) % SIDES] = true;
          lastGapSector = s2;
          patternQueue.push({ gaps: gaps2, delayFactor: 1.05 });
        } else if (type < 0.80) {
          // Zik-Zak (2 sektör atlamalı)
          const jump = Math.random() < 0.5 ? 2 : -2;
          for (let i = 0; i < 3; i++) {
            lastGapSector = (lastGapSector + (i % 2 === 0 ? jump : -jump) + SIDES) % SIDES;
            const gaps = new Array(SIDES).fill(false);
            gaps[lastGapSector] = true;
            patternQueue.push({ gaps, delayFactor: 1.08 });
          }
        } else {
          // Tekli rastgele (en fazla 2 sektör uzakta, adil geçiş)
          const step = Math.floor(Math.random() * 5) - 2; // -2 .. +2
          lastGapSector = (lastGapSector + step + SIDES) % SIDES;
          const gaps = new Array(SIDES).fill(false);
          gaps[lastGapSector] = true;
          patternQueue.push({ gaps, delayFactor: 1.0 });
        }
      }

      function spawnWall() {
        if (patternQueue.length === 0) {
          enqueuePattern();
        }
        const next = patternQueue.shift();
        const difficulty = Math.min(1, survivalTime / 65);
        const speed = 250 + difficulty * 210; // px / s
        const thickness = 18 + difficulty * 8;

        walls.push({
          r: maxRadius,
          speed,
          thickness,
          gaps: next.gaps,
          grazed: false,
          passed: false
        });

        // Bir sonraki duvar süresi
        const baseInterval = 0.68 - difficulty * 0.27;
        return Math.max(0.32, baseInterval * next.delayFactor);
      }

      // ==========================================
      // PARTİKÜL VE GRAZE EFEKTLERİ
      // ==========================================
      function spawnParticles(x, y, count, color, speedMin, speedMax, size = 3) {
        for (let i = 0; i < count; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = speedMin + Math.random() * (speedMax - speedMin);
          particles.push({
            x,
            y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            life: 1,
            decay: 1.6 + Math.random() * 1.4,
            color,
            size: size * (0.7 + Math.random() * 0.8)
          });
        }
      }

      function spawnGrazeSparks(angle, edgeAngle) {
        // Teğet noktasından dışarı kıvılcımlar
        const px = Math.cos(angle) * ORBIT_RADIUS;
        const py = Math.sin(angle) * ORBIT_RADIUS;
        const tangentDir = angle > edgeAngle ? 1 : -1;

        for (let i = 0; i < 3; i++) {
          const spread = (Math.random() - 0.5) * 0.9;
          const sparkAngle = angle + Math.PI + tangentDir * 0.4 + spread;
          const spd = 120 + Math.random() * 210;
          particles.push({
            x: px,
            y: py,
            vx: Math.cos(sparkAngle) * spd,
            vy: Math.sin(sparkAngle) * spd,
            life: 1,
            decay: 2.5 + Math.random() * 1.5,
            color: Math.random() < 0.5 ? "#fff48c" : "#00ffff",
            size: 2 + Math.random() * 2.5
          });
        }
      }

      function triggerGraze(wall, angle) {
        wall.grazed = true;
        multiplier = Math.min(12.0, +(multiplier + 0.5).toFixed(1));
        multiplierTimer = MULTIPLIER_DURATION;

        const bonus = Math.round(120 * multiplier);
        score += bonus;
        shakeIntensity = Math.max(shakeIntensity, 3.2);

        AudioEngine.playGraze(multiplier);

        const gx = Math.cos(angle) * (ORBIT_RADIUS + 26);
        const gy = Math.sin(angle) * (ORBIT_RADIUS + 26);

        floatingTexts.push({
          text: `GRAZE! +${bonus}`,
          x: gx,
          y: gy,
          vy: -35,
          life: 1.0,
          scale: 1.15
        });

        grazeRings.push({
          x: Math.cos(angle) * ORBIT_RADIUS,
          y: Math.sin(angle) * ORBIT_RADIUS,
          r: 8,
          life: 1.0
        });
      }

      function triggerGameOver() {
        gameState = STATE.GAMEOVER;
        gameOverTimer = 0;
        shakeIntensity = 26;
        flashAlpha = 0.85;
        AudioEngine.playCrash();

        const px = Math.cos(playerAngle) * ORBIT_RADIUS;
        const py = Math.sin(playerAngle) * ORBIT_RADIUS;
        spawnParticles(px, py, 55, "#ff3b6b", 80, 440, 4.5);
        spawnParticles(px, py, 25, "#ffffff", 60, 300, 3);

        newRecordFlags = saveRecords(score, survivalTime);
      }

      // ==========================================
      // GÜNCELLEME (UPDATE)
      // ==========================================
      function update(dt) {
        // Renk döngüsü
        hue = (hue + dt * (gameState === STATE.PLAYING ? 18 : 10)) % 360;

        // Nabız / Ritim (BPM zamanla 132 -> 158 arası hızlanır)
        const bpm = gameState === STATE.PLAYING ? Math.min(158, 132 + survivalTime * 0.45) : 124;
        const beatInterval = 60 / bpm;
        beatTimer += dt;
        if (beatTimer >= beatInterval) {
          beatTimer -= beatInterval;
          beatStep++;
          pulse = 1.0;
          if (gameState === STATE.PLAYING) {
            AudioEngine.playBeat(1.0, beatStep);
          }
        }
        pulse = Math.max(0, pulse - dt * 3.8);

        // Ekran titremesi ve flaş sönümlemesi
        shakeIntensity = Math.max(0, shakeIntensity - dt * 42);
        flashAlpha = Math.max(0, flashAlpha - dt * 2.4);

        // Kamera açısı/eğim salınımı
        cameraTiltPhase += dt * (gameState === STATE.PLAYING ? 1.35 : 0.6);

        // Parçacıklar ve yüzen yazılar her durumda güncellenir
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.96;
          p.vy *= 0.96;
          p.life -= p.decay * dt;
          if (p.life <= 0) particles.splice(i, 1);
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.y += ft.vy * dt;
          ft.life -= dt * 1.15;
          if (ft.life <= 0) floatingTexts.splice(i, 1);
        }

        for (let i = grazeRings.length - 1; i >= 0; i--) {
          const gr = grazeRings[i];
          gr.r += dt * 115;
          gr.life -= dt * 2.2;
          if (gr.life <= 0) grazeRings.splice(i, 1);
        }

        if (gameState === STATE.MENU) {
          worldRotation += dt * 0.35;
          playerAngle += dt * 1.1;
          return;
        }

        if (gameState === STATE.GAMEOVER) {
          gameOverTimer += dt;
          worldRotation += dt * 0.12;
          return;
        }

        // === PLAYING DURUMU ===
        survivalTime += dt;
        score += dt * 60 * multiplier;

        // Çarpan zamanlayıcısı
        if (multiplier > 1.0) {
          multiplierTimer -= dt;
          if (multiplierTimer <= 0) {
            multiplier = Math.max(1.0, +(multiplier - 0.5).toFixed(1));
            multiplierTimer = multiplier > 1.0 ? 1.2 : 0;
          }
        }

        // Dünya dönüşü (zamanla hızlanır ve yön değiştirir)
        const difficulty = Math.min(1, survivalTime / 60);
        const targetRotSpeed = (0.48 + difficulty * 0.95) * rotDirection;
        worldRotSpeed += (targetRotSpeed - worldRotSpeed) * dt * 2.5;
        worldRotation += worldRotSpeed * dt;

        rotSwitchTimer -= dt;
        if (rotSwitchTimer <= 0) {
          rotDirection *= -1;
          rotSwitchTimer = 4.5 + Math.random() * 4.5;
        }

        // Oyuncu hareketi (Sol / Sağ)
        let moveDir = 0;
        if (keys.left) moveDir -= 1;
        if (keys.right) moveDir += 1;
        playerAngle = normalizeAngle(playerAngle + moveDir * PLAYER_SPEED * dt);

        // Oyuncu izi (Trail)
        playerTrail.unshift(playerAngle);
        if (playerTrail.length > 10) playerTrail.pop();

        // Duvar oluşturma
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnTimer = spawnWall();
        }

        // Duvar hareketi, Çarpışma ve Graze Kontrolü
        const normPlayer = normalizeAngle(playerAngle);
        const playerSector = Math.floor(normPlayer / SECTOR_ANGLE) % SIDES;
        const sectorStart = playerSector * SECTOR_ANGLE;
        const sectorEnd = (playerSector + 1) * SECTOR_ANGLE;

        for (let i = walls.length - 1; i >= 0; i--) {
          const w = walls[i];
          w.r -= w.speed * dt;

          const innerR = w.r;
          const outerR = w.r + w.thickness;

          // Çarpışma penceresi (adil hitbox: görselden biraz daha toleranslı)
          const hitInner = ORBIT_RADIUS - 6;
          const hitOuter = ORBIT_RADIUS + 6;

          if (innerR <= hitOuter && outerR >= hitInner) {
            if (!w.gaps[playerSector]) {
              // Kenarın tam sınırında milimetrik tolerans (haksız ölümü önle)
              const distToLeft = normPlayer - sectorStart;
              const distToRight = sectorEnd - normPlayer;
              const leftNeighborOpen = w.gaps[(playerSector - 1 + SIDES) % SIDES];
              const rightNeighborOpen = w.gaps[(playerSector + 1) % SIDES];

              const cornerGrace = 0.055; // ~3.1 derece af payı
              const savedByLeft = leftNeighborOpen && distToLeft < cornerGrace;
              const savedByRight = rightNeighborOpen && distToRight < cornerGrace;

              if (!savedByLeft && !savedByRight) {
                triggerGameOver();
                return;
              }
            }
          }

          // GRAZE (Teğet Geçiş) Penceresi - Çarpışma alanından daha geniş
          const grazeInner = ORBIT_RADIUS - 18;
          const grazeOuter = ORBIT_RADIUS + 18;
          if (innerR <= grazeOuter && outerR >= grazeInner) {
            const leftNeighborFilled = !w.gaps[(playerSector - 1 + SIDES) % SIDES];
            const rightNeighborFilled = !w.gaps[(playerSector + 1) % SIDES];

            const distLeft = normPlayer - sectorStart;
            const distRight = sectorEnd - normPlayer;

            const isNearLeft = leftNeighborFilled && distLeft < GRAZE_ANGLE_THRESHOLD;
            const isNearRight = rightNeighborFilled && distRight < GRAZE_ANGLE_THRESHOLD;

            if (w.gaps[playerSector] && (isNearLeft || isNearRight)) {
              const edgeAng = isNearLeft ? sectorStart : sectorEnd;
              spawnGrazeSparks(normPlayer, edgeAng);
              if (!w.grazed) {
                triggerGraze(w, normPlayer);
              }
            }
          }

          // Duvar merkeze ulaştığında sil
          if (outerR < CORE_RADIUS * 0.7) {
            walls.splice(i, 1);
          }
        }
      }

      // ==========================================
      // ÇİZİM (RENDER)
      // ==========================================
      function drawHexagon(radius, lineWidth, strokeStyle, fillStyle = null) {
        ctx.beginPath();
        for (let i = 0; i < SIDES; i++) {
          const a = i * SECTOR_ANGLE;
          const x = Math.cos(a) * radius;
          const y = Math.sin(a) * radius;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        if (fillStyle) {
          ctx.fillStyle = fillStyle;
          ctx.fill();
        }
        if (lineWidth > 0 && strokeStyle) {
          ctx.lineWidth = lineWidth;
          ctx.strokeStyle = strokeStyle;
          ctx.stroke();
        }
      }

      function render() {
        // Arka plan temizle
        ctx.fillStyle = `hsl(${hue}, 35%, ${4 + pulse * 3}%)`;
        ctx.fillRect(0, 0, width, height);

        ctx.save();

        // Merkez ve Ekran Titremesi
        const shakeX = (Math.random() - 0.5) * shakeIntensity;
        const shakeY = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(width * 0.5 + shakeX, height * 0.5 + shakeY);

        // Kamera Eğimi / Nabız Zoom Efekti
        const zoom = 1 + pulse * 0.04;
        const tiltX = Math.sin(cameraTiltPhase) * (gameState === STATE.PLAYING ? 0.05 : 0.02);
        const tiltY = Math.cos(cameraTiltPhase * 0.8) * (gameState === STATE.PLAYING ? 0.04 : 0.02);
        ctx.scale(zoom + tiltX, zoom - tiltY);

        // Dünya Dönüşü
        ctx.rotate(worldRotation);

        // 1. Arka Plan Altıgen Dilimleri (Ritmik Nabız)
        for (let i = 0; i < SIDES; i++) {
          const a1 = i * SECTOR_ANGLE;
          const a2 = (i + 1) * SECTOR_ANGLE;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a1) * maxRadius, Math.sin(a1) * maxRadius);
          ctx.lineTo(Math.cos(a2) * maxRadius, Math.sin(a2) * maxRadius);
          ctx.closePath();

          const isEven = i % 2 === 0;
          const lightness = isEven ? (7 + pulse * 5) : (4 + pulse * 2.5);
          ctx.fillStyle = `hsla(${hue}, 55%, ${lightness}%, 1)`;
          ctx.fill();

          // Sektör ayırıcı ince lazer çizgileri
          ctx.strokeStyle = `hsla(${hue}, 80%, 50%, ${0.08 + pulse * 0.08})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a1) * maxRadius, Math.sin(a1) * maxRadius);
          ctx.stroke();
        }

        // 2. Kapanan Altıgen Lazer Duvarlar
        const wallColor = `hsl(${(hue + 140) % 360}, 95%, 62%)`;
        const wallGlow = `hsla(${(hue + 140) % 360}, 100%, 55%, 0.35)`;

        for (let w of walls) {
          const rIn = Math.max(CORE_RADIUS * 0.65, w.r);
          const rOut = w.r + w.thickness;
          if (rOut <= rIn) continue;

          for (let s = 0; s < SIDES; s++) {
            if (w.gaps[s]) continue;

            const a1 = s * SECTOR_ANGLE;
            const a2 = (s + 1) * SECTOR_ANGLE;

            ctx.beginPath();
            ctx.moveTo(Math.cos(a1) * rIn, Math.sin(a1) * rIn);
            ctx.lineTo(Math.cos(a1) * rOut, Math.sin(a1) * rOut);
            ctx.lineTo(Math.cos(a2) * rOut, Math.sin(a2) * rOut);
            ctx.lineTo(Math.cos(a2) * rIn, Math.sin(a2) * rIn);
            ctx.closePath();

            ctx.fillStyle = w.grazed ? "#fff6a8" : wallColor;
            ctx.fill();

            // Dış parlama çizgisi
            ctx.strokeStyle = w.grazed ? "#ffffff" : wallGlow;
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        }

        // 3. Yörünge Çemberi Rehberi
        ctx.beginPath();
        ctx.arc(0, 0, ORBIT_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${hue}, 90%, 70%, ${0.18 + pulse * 0.14})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 4. Graze Halkaları
        for (let gr of grazeRings) {
          ctx.beginPath();
          ctx.arc(gr.x, gr.y, gr.r, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255, 245, 140, ${gr.life * 0.9})`;
          ctx.lineWidth = 2.5 * gr.life;
          ctx.stroke();
        }

        // 5. Oyuncu ve İzi (Trail)
        if (gameState !== STATE.GAMEOVER) {
          // İz
          for (let i = playerTrail.length - 1; i >= 0; i--) {
            const ang = playerTrail[i];
            const alpha = (1 - i / playerTrail.length) * 0.35;
            const px = Math.cos(ang) * ORBIT_RADIUS;
            const py = Math.sin(ang) * ORBIT_RADIUS;
            ctx.beginPath();
            ctx.arc(px, py, 5 * (1 - i / playerTrail.length), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 255, 255, ${alpha})`;
            ctx.fill();
          }

          // Oyuncu Üçgeni
          const px = Math.cos(playerAngle) * ORBIT_RADIUS;
          const py = Math.sin(playerAngle) * ORBIT_RADIUS;

          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(playerAngle);

          ctx.shadowColor = "#00ffff";
          ctx.shadowBlur = 14 + pulse * 8;
          ctx.beginPath();
          ctx.moveTo(11, 0);
          ctx.lineTo(-8, -7);
          ctx.lineTo(-5, 0);
          ctx.lineTo(-8, 7);
          ctx.closePath();

          ctx.fillStyle = "#ffffff";
          ctx.fill();
          ctx.lineWidth = 1.8;
          ctx.strokeStyle = "#00ffff";
          ctx.stroke();
          ctx.restore();
        }

        // 6. Merkez Çekirdek (Nabızla Büyür)
        const coreR = CORE_RADIUS + pulse * 7;
        drawHexagon(coreR, 3.5, `hsl(${hue}, 100%, 70%)`, `hsla(${hue}, 60%, 10%, 0.95)`);
        drawHexagon(coreR * 0.62, 1.5, `hsla(${(hue + 60) % 360}, 100%, 75%, 0.6)`);

        // 7. Parçacıklar
        for (let p of particles) {
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // 8. Yüzen 'GRAZE!' Metinleri (Dünya dönüşünden bağımsız okunaklı olması için açıyı geri al)
        for (let ft of floatingTexts) {
          ctx.save();
          ctx.translate(ft.x, ft.y);
          ctx.rotate(-worldRotation);
          ctx.globalAlpha = Math.max(0, ft.life);
          ctx.font = `900 ${Math.round(16 * ft.scale)}px monospace`;
          ctx.textAlign = "center";
          ctx.shadowColor = "#ffea00";
          ctx.shadowBlur = 12;
          ctx.fillStyle = "#fff68f";
          ctx.fillText(ft.text, 0, 0);
          ctx.restore();
        }

        ctx.restore();

        // Çarpışma / Başlangıç Ekran Flaşı
        if (flashAlpha > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
          ctx.fillRect(0, 0, width, height);
        }

        // ==========================================
        // ARAYÜZ (HUD & MENÜLER)
        // ==========================================
        renderUI();
      }

      function renderUI() {
        if (gameState === STATE.PLAYING || gameState === STATE.GAMEOVER) {
          // Sol Üst: Skor ve Çarpan
          ctx.save();
          ctx.textAlign = "left";
          ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
          ctx.font = "700 13px monospace";
          ctx.fillText("SKOR", 28, 36);

          ctx.fillStyle = "#ffffff";
          ctx.font = "900 32px monospace";
          ctx.fillText(Math.floor(score).toLocaleString("tr-TR"), 28, 68);

          // Çarpan göstergesi
          const multColor = multiplier >= 4 ? "#ffea00" : multiplier > 1 ? "#00ffff" : "rgba(255,255,255,0.6)";
          ctx.fillStyle = multColor;
          ctx.font = `900 ${multiplier > 1 ? 22 : 16}px monospace`;
          ctx.fillText(`x${multiplier.toFixed(1)} ÇARPAN`, 28, 96);

          if (multiplier > 1.0 && gameState === STATE.PLAYING) {
            const barW = 130;
            const ratio = Math.max(0, Math.min(1, multiplierTimer / MULTIPLIER_DURATION));
            ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
            ctx.fillRect(28, 106, barW, 5);
            ctx.fillStyle = multColor;
            ctx.fillRect(28, 106, barW * ratio, 5);
          }

          // Sağ Üst: Süre ve En İyi
          ctx.textAlign = "right";
          ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
          ctx.font = "700 13px monospace";
          ctx.fillText("HAYATTA KALMA", width - 28, 36);

          ctx.fillStyle = "#ffffff";
          ctx.font = "900 32px monospace";
          ctx.fillText(`${survivalTime.toFixed(2)}s`, width - 28, 68);

          ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
          ctx.font = "600 13px monospace";
          ctx.fillText(`EN İYİ: ${bestTime.toFixed(2)}s  |  ${bestScore.toLocaleString("tr-TR")}`, width - 28, 92);
          ctx.restore();
        }

        if (gameState === STATE.MENU) {
          ctx.save();
          ctx.fillStyle = "rgba(5, 5, 12, 0.55)";
          ctx.fillRect(0, 0, width, height);

          ctx.textAlign = "center";
          const cx = width * 0.5;
          const cy = height * 0.5;

          // Başlık
          ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
          ctx.shadowBlur = 24;
          ctx.fillStyle = "#ffffff";
          ctx.font = "900 58px monospace";
          ctx.fillText("HEX ORBIT", cx, cy - 85);
          ctx.shadowBlur = 0;

          ctx.fillStyle = `hsl(${(hue + 140) % 360}, 95%, 70%)`;
          ctx.font = "700 16px monospace";
          ctx.fillText("YÖRÜNGE HAYATTA KALMA", cx, cy - 50);

          // Kontroller
          ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
          ctx.font = "600 16px monospace";
          ctx.fillText("[ ← / → ]  veya  [ A / D ]  ile Yörüngede Dön", cx, cy + 10);

          ctx.fillStyle = "#fff48c";
          ctx.font = "700 15px monospace";
          ctx.fillText("Duvar Kenarından Teğet Geç = GRAZE! (Çarpan Artar)", cx, cy + 40);

          // Rekorlar
          ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
          ctx.font = "600 15px monospace";
          ctx.fillText(`EN İYİ SÜRE: ${bestTime.toFixed(2)}s   •   EN YÜKSEK SKOR: ${bestScore.toLocaleString("tr-TR")}`, cx, cy + 88);

          // Yanıp sönen SPACE mesajı
          const blink = 0.45 + 0.55 * Math.abs(Math.sin(performance.now() * 0.004));
          ctx.fillStyle = `rgba(0, 255, 255, ${blink})`;
          ctx.font = "900 20px monospace";
          ctx.fillText("[ BAŞLAMAK İÇİN SPACE TUŞUNA BAS ]", cx, cy + 148);

          ctx.restore();
        }

        if (gameState === STATE.GAMEOVER && gameOverTimer > 0.2) {
          ctx.save();
          const alpha = Math.min(0.72, (gameOverTimer - 0.2) * 2.5);
          ctx.fillStyle = `rgba(10, 4, 14, ${alpha})`;
          ctx.fillRect(0, 0, width, height);

          ctx.textAlign = "center";
          const cx = width * 0.5;
          const cy = height * 0.5;

          ctx.shadowColor = "#ff2a5f";
          ctx.shadowBlur = 22;
          ctx.fillStyle = "#ff4d79";
          ctx.font = "900 48px monospace";
          ctx.fillText("YÖRÜNGE KIRILDI", cx, cy - 75);
          ctx.shadowBlur = 0;

          ctx.fillStyle = "#ffffff";
          ctx.font = "800 24px monospace";
          ctx.fillText(`SÜRE: ${survivalTime.toFixed(2)}s    |    SKOR: ${Math.floor(score).toLocaleString("tr-TR")}`, cx, cy - 15);

          if (newRecordFlags.isNewBestScore || newRecordFlags.isNewBestTime) {
            ctx.fillStyle = "#ffea00";
            ctx.font = "900 18px monospace";
            ctx.fillText("★ YENİ REKOR KAYDEDİLDİ! ★", cx, cy + 25);
          } else {
            ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
            ctx.font = "600 15px monospace";
            ctx.fillText(`EN İYİ: ${bestTime.toFixed(2)}s   •   ${bestScore.toLocaleString("tr-TR")}`, cx, cy + 25);
          }

          if (gameOverTimer > 0.35) {
            const blink = 0.45 + 0.55 * Math.abs(Math.sin(performance.now() * 0.005));
            ctx.fillStyle = `rgba(0, 255, 255, ${blink})`;
            ctx.font = "900 20px monospace";
            ctx.fillText("[ YENİDEN OYNAMAK İÇİN SPACE ]", cx, cy + 95);
          }
          ctx.restore();
        }
      }

      // ==========================================
      // ANA OYUN DÖNGÜSÜ
      // ==========================================
      let lastTime = performance.now();
      function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        update(dt);
        render();

        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>

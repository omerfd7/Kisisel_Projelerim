<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Drift Düellosu — 2 Kişilik</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070913;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hud {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      margin-bottom: 6px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #1e293b;
      border-radius: 10px;
    }
    .player-hud {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 700;
    }
    .p1-color { color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    .p2-color { color: #fb923c; text-shadow: 0 0 10px rgba(251, 146, 60, 0.5); }
    .hearts { font-size: 1.2rem; letter-spacing: 3px; }
    .score-center {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #f8fafc;
    }
    .score-sub {
      font-size: 0.7rem;
      color: #94a3b8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    canvas {
      background: #0b0f1e;
      border: 2px solid #334155;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(30, 41, 59, 0.4);
      max-width: 98vw;
      max-height: 82vh;
      aspect-ratio: 1000 / 620;
      display: block;
    }
    .footer-hint {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #64748b;
      letter-spacing: 0.5px;
    }
    kbd {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 1px 6px;
      color: #cbd5e1;
      font-family: monospace;
      font-size: 0.85em;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="player-hud p1-color">
      <span>P1 [WASD]</span>
      <span id="p1-hearts" class="hearts">♥♥♥</span>
    </div>
    <div class="score-center">
      <div id="round-score">0 - 0</div>
      <div class="score-sub">İLK 3 TURU ALAN KAZANIR</div>
    </div>
    <div class="player-hud p2-color">
      <span id="p2-hearts" class="hearts">♥♥♥</span>
      <span>[OKLAR] P2</span>
    </div>
  </div>

  <canvas id="game" width="1000" height="620"></canvas>

  <div class="footer-hint">
    P1: <kbd>W</kbd> Gaz <kbd>A</kbd><kbd>D</kbd> Dön <kbd>S</kbd> Ateş &nbsp;|&nbsp;
    P2: <kbd>↑</kbd> Gaz <kbd>←</kbd><kbd>→</kbd> Dön <kbd>↓</kbd> Ateş &nbsp;|&nbsp;
    Başlat / Devam: <kbd>SPACE</kbd>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  const p1HeartsEl = document.getElementById('p1-hearts');
  const p2HeartsEl = document.getElementById('p2-hearts');
  const roundScoreEl = document.getElementById('round-score');

  // --- SES MOTORU (Web Audio API) ---
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'shoot') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(620, now);
      osc.frequency.exponentialRampToValueAtTime(160, now + 0.11);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'bounce') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(520, now + 0.06);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.start(now);
      osc.stop(now + 0.07);
    } else if (type === 'hit') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.22);
      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      osc.start(now);
      osc.stop(now + 0.23);
    } else if (type === 'explode') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(130, now);
      osc.frequency.exponentialRampToValueAtTime(28, now + 0.48);
      gain.gain.setValueAtTime(0.32, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);
      osc.start(now);
      osc.stop(now + 0.5);
    } else if (type === 'powerup') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(960, now + 0.18);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.21);
    }
  }

  // --- KLAVYE GİRİŞLERİ ---
  const keys = {};
  const blockedKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];

  window.addEventListener('keydown', (e) => {
    if (blockedKeys.includes(e.code)) e.preventDefault();
    initAudio();

    if (!keys[e.code]) {
      keys[e.code] = true;
      handleSinglePress(e.code);
    }
  });

  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });

  // --- OYUN DURUMU ---
  const TARGET_WINS = 3;
  let state = 'MENU'; // MENU, PLAYING, ROUND_OVER, MATCH_OVER
  let scores = [0, 0];
  let roundWinner = 0;
  let screenShake = 0;
  let hitStop = 0;
  let powerupTimer = 6;

  // Ortadaki sabit engeller (bumperlar)
  const bumpers = [
    { x: W * 0.5, y: H * 0.24, r: 34 },
    { x: W * 0.5, y: H * 0.76, r: 34 },
    { x: W * 0.30, y: H * 0.50, r: 22 },
    { x: W * 0.70, y: H * 0.50, r: 22 },
  ];

  let bullets = [];
  let particles = [];
  let powerups = [];
  let players = [];

  function createPlayer(id) {
    const isP1 = id === 1;
    return {
      id,
      x: isP1 ? 110 : W - 110,
      y: H / 2,
      vx: 0,
      vy: 0,
      angle: isP1 ? 0 : Math.PI,
      radius: 17,
      color: isP1 ? '#38bdf8' : '#fb923c',
      glow: isP1 ? 'rgba(56, 189, 248, 0.7)' : 'rgba(251, 146, 60, 0.7)',
      hp: 3,
      maxHp: 3,
      ammo: 3,
      maxAmmo: 3,
      ammoRecharge: 0,
      shootCooldown: 0,
      invuln: 0,
      shield: false,
      tripleTimer: 0,
      speedTimer: 0,
      trail: [],
      controls: isP1
        ? { up: 'KeyW', left: 'KeyA', right: 'KeyD', fire: 'KeyS' }
        : { up: 'ArrowUp', left: 'ArrowLeft', right: 'ArrowRight', fire: 'ArrowDown' }
    };
  }

  function resetRound() {
    players = [createPlayer(1), createPlayer(2)];
    bullets = [];
    particles = [];
    powerups = [];
    powerupTimer = 5;
    updateHUD();
  }

  function updateHUD() {
    const drawHearts = (hp, shield) => {
      let s = '♥'.repeat(Math.max(0, hp)) + '♡'.repeat(Math.max(0, 3 - hp));
      if (shield) s += ' 🛡️';
      return s;
    };
    p1HeartsEl.textContent = drawHearts(players[0].hp, players[0].shield);
    p2HeartsEl.textContent = drawHearts(players[1].hp, players[1].shield);
    roundScoreEl.textContent = `${scores[0]} - ${scores[1]}`;
  }

  function handleSinglePress(code) {
    if (code === 'Space' || code === 'Enter') {
      if (state === 'MENU') {
        scores = [0, 0];
        resetRound();
        state = 'PLAYING';
      } else if (state === 'ROUND_OVER') {
        resetRound();
        state = 'PLAYING';
      } else if (state === 'MATCH_OVER') {
        scores = [0, 0];
        resetRound();
        state = 'PLAYING';
      }
    }
  }

  function spawnParticles(x, y, color, count = 16, speed = 220, size = 3) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = (0.2 + Math.random() * 0.8) * speed;
      particles.push({
        x, y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        life: 0.3 + Math.random() * 0.35,
        maxLife: 0.65,
        color,
        size: size * (0.6 + Math.random() * 0.8)
      });
    }
  }

  function spawnPowerup() {
    const types = [
      { type: 'SHIELD', label: 'KALKAN', color: '#4ade80' },
      { type: 'TRIPLE', label: '3x ATIŞ', color: '#c084fc' },
      { type: 'SPEED',  label: 'TURBO',  color: '#facc15' }
    ];
    const pick = types[Math.floor(Math.random() * types.length)];
    powerups.push({
      x: W / 2,
      y: H / 2 + (Math.random() - 0.5) * 140,
      r: 15,
      pulse: 0,
      ...pick
    });
  }

  function fireBullet(p) {
    const angles = p.tripleTimer > 0 ? [-0.16, 0, 0.16] : [0];
    const bulletSpeed = 560;

    angles.forEach(offset => {
      const a = p.angle + offset;
      bullets.push({
        owner: p.id,
        x: p.x + Math.cos(a) * (p.radius + 8),
        y: p.y + Math.sin(a) * (p.radius + 8),
        vx: Math.cos(a) * bulletSpeed + p.vx * 0.2,
        vy: Math.sin(a) * bulletSpeed + p.vy * 0.2,
        r: 5,
        bouncesLeft: 1,
        bounced: false,
        color: p.color,
        life: 3.2
      });
    });

    // Geri tepme (recoil)
    p.vx -= Math.cos(p.angle) * 45;
    p.vy -= Math.sin(p.angle) * 45;
    playSound('shoot');
  }

  // --- GÜNCELLEME DÖNGÜSÜ ---
  function update(dt) {
    if (hitStop > 0) {
      hitStop -= dt;
      return;
    }

    if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 35);

    // Parçacıkları her durumda güncelle
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= 0.94;
      pt.vy *= 0.94;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }

    if (state !== 'PLAYING') return;

    // Powerup zamanlayıcısı
    powerupTimer -= dt;
    if (powerupTimer <= 0 && powerups.length < 2) {
      spawnPowerup();
      powerupTimer = 8;
    }

    // Oyuncuları güncelle
    for (const p of players) {
      const c = p.controls;
      const rotSpeed = p.speedTimer > 0 ? 5.2 : 4.2;
      const thrust = p.speedTimer > 0 ? 780 : 560;

      if (keys[c.left]) p.angle -= rotSpeed * dt;
      if (keys[c.right]) p.angle += rotSpeed * dt;

      if (keys[c.up]) {
        p.vx += Math.cos(p.angle) * thrust * dt;
        p.vy += Math.sin(p.angle) * thrust * dt;

        if (Math.random() < 0.7) {
          particles.push({
            x: p.x - Math.cos(p.angle) * p.radius,
            y: p.y - Math.sin(p.angle) * p.radius,
            vx: -Math.cos(p.angle) * 110 + (Math.random() - 0.5) * 40,
            vy: -Math.sin(p.angle) * 110 + (Math.random() - 0.5) * 40,
            life: 0.18,
            maxLife: 0.18,
            color: p.color,
            size: 3.2
          });
        }
      }

      // Ateş etme
      if (p.shootCooldown > 0) p.shootCooldown -= dt;
      if (keys[c.fire] && p.shootCooldown <= 0 && p.ammo > 0) {
        fireBullet(p);
        p.ammo--;
        p.shootCooldown = p.speedTimer > 0 ? 0.14 : 0.22;
      }

      // Mermi şarjı
      const rechargeTime = p.speedTimer > 0 ? 0.45 : 0.78;
      if (p.ammo < p.maxAmmo) {
        p.ammoRecharge += dt;
        if (p.ammoRecharge >= rechargeTime) {
          p.ammo++;
          p.ammoRecharge = 0;
        }
      } else {
        p.ammoRecharge = 0;
      }

      if (p.invuln > 0) p.invuln -= dt;
      if (p.tripleTimer > 0) p.tripleTimer -= dt;
      if (p.speedTimer > 0) p.speedTimer -= dt;

      // Sürtünme (uzay/drift hissi)
      const damping = Math.pow(0.28, dt);
      p.vx *= damping;
      p.vy *= damping;

      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // Kuyruk izi
      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > 14) p.trail.shift();

      // Duvar çarpışmaları
      if (p.x - p.radius < 0) { p.x = p.radius; p.vx = Math.abs(p.vx) * 0.6; }
      if (p.x + p.radius > W) { p.x = W - p.radius; p.vx = -Math.abs(p.vx) * 0.6; }
      if (p.y - p.radius < 0) { p.y = p.radius; p.vy = Math.abs(p.vy) * 0.6; }
      if (p.y + p.radius > H) { p.y = H - p.radius; p.vy = -Math.abs(p.vy) * 0.6; }

      // Bumper çarpışmaları
      for (const b of bumpers) {
        const dx = p.x - b.x;
        const dy = p.y - b.y;
        const dist = Math.hypot(dx, dy);
        const minDist = p.radius + b.r;
        if (dist < minDist && dist > 0) {
          const nx = dx / dist;
          const ny = dy / dist;
          p.x = b.x + nx * minDist;
          p.y = b.y + ny * minDist;
          const dot = p.vx * nx + p.vy * ny;
          if (dot < 0) {
            p.vx -= 1.6 * dot * nx;
            p.vy -= 1.6 * dot * ny;
          }
        }
      }

      // Powerup toplama
      for (let i = powerups.length - 1; i >= 0; i--) {
        const pw = powerups[i];
        if (Math.hypot(p.x - pw.x, p.y - pw.y) < p.radius + pw.r) {
          if (pw.type === 'SHIELD') p.shield = true;
          if (pw.type === 'TRIPLE') p.tripleTimer = 7;
          if (pw.type === 'SPEED') p.speedTimer = 7;
          playSound('powerup');
          spawnParticles(pw.x, pw.y, pw.color, 18, 180, 3.5);
          powerups.splice(i, 1);
          updateHUD();
        }
      }
    }

    // İki gemi birbirine çarparsa sekme
    const p1 = players[0], p2 = players[1];
    const sdx = p2.x - p1.x;
    const sdy = p2.y - p1.y;
    const sdist = Math.hypot(sdx, sdy);
    const sMin = p1.radius + p2.radius;
    if (sdist < sMin && sdist > 0) {
      const nx = sdx / sdist;
      const ny = sdy / sdist;
      const overlap = (sMin - sdist) * 0.5;
      p1.x -= nx * overlap;
      p1.y -= ny * overlap;
      p2.x += nx * overlap;
      p2.y += ny * overlap;

      const rvx = p2.vx - p1.vx;
      const rvy = p2.vy - p1.vy;
      const velAlongNormal = rvx * nx + rvy * ny;
      if (velAlongNormal < 0) {
        const impulse = -1.3 * velAlongNormal;
        p1.vx -= impulse * nx * 0.5;
        p1.vy -= impulse * ny * 0.5;
        p2.vx += impulse * nx * 0.5;
        p2.vy += impulse * ny * 0.5;
        spawnParticles((p1.x + p2.x) / 2, (p1.y + p2.y) / 2, '#ffffff', 8, 150, 2);
      }
    }

    // Powerup animasyonu
    for (const pw of powerups) pw.pulse += dt * 4;

    // Mermileri güncelle
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;

      if (b.life <= 0) {
        bullets.splice(i, 1);
        continue;
      }

      // Duvar sekmesi
      let hitWall = false;
      if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); hitWall = true; }
      else if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); hitWall = true; }
      if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); hitWall = true; }
      else if (b.y + b.r > H) { b.y = H - b.r; b.vy = -Math.abs(b.vy); hitWall = true; }

      if (hitWall) {
        if (b.bouncesLeft > 0) {
          b.bouncesLeft--;
          b.bounced = true;
          playSound('bounce');
          spawnParticles(b.x, b.y, '#ffffff', 5, 100, 2);
        } else {
          spawnParticles(b.x, b.y, b.color, 6, 90, 2);
          bullets.splice(i, 1);
          continue;
        }
      }

      // Bumper sekmesi
      let destroyed = false;
      for (const bmp of bumpers) {
        const dx = b.x - bmp.x;
        const dy = b.y - bmp.y;
        const dist = Math.hypot(dx, dy);
        if (dist < b.r + bmp.r) {
          if (b.bouncesLeft > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            b.x = bmp.x + nx * (b.r + bmp.r + 1);
            b.y = bmp.y + ny * (b.r + bmp.r + 1);
            const dot = b.vx * nx + b.vy * ny;
            b.vx -= 2 * dot * nx;
            b.vy -= 2 * dot * ny;
            b.bouncesLeft--;
            b.bounced = true;
            playSound('bounce');
            spawnParticles(b.x, b.y, '#94a3b8', 6, 110, 2);
          } else {
            spawnParticles(b.x, b.y, b.color, 6, 90, 2);
            bullets.splice(i, 1);
            destroyed = true;
          }
          break;
        }
      }
      if (destroyed) continue;

      // Oyuncu vurma kontrolü
      for (const p of players) {
        if (p.id === b.owner) continue;
        if (p.invuln > 0) continue;

        const dist = Math.hypot(b.x - p.x, b.y - p.y);
        if (dist < p.radius + b.r) {
          bullets.splice(i, 1);

          // İtme uygula
          p.vx += b.vx * 0.35;
          p.vy += b.vy * 0.35;

          if (p.shield) {
            p.shield = false;
            p.invuln = 0.45;
            screenShake = 6;
            playSound('bounce');
            spawnParticles(p.x, p.y, '#4ade80', 22, 240, 3.5);
          } else {
            p.hp--;
            p.invuln = 0.65;
            screenShake = 10;
            hitStop = 0.045;
            spawnParticles(p.x, p.y, p.color, 25, 280, 3.5);

            if (p.hp <= 0) {
              playSound('explode');
              screenShake = 18;
              hitStop = 0.08;
              spawnParticles(p.x, p.y, p.color, 55, 360, 4.5);
              spawnParticles(p.x, p.y, '#ffffff', 25, 240, 3);

              const winnerIdx = p.id === 1 ? 1 : 0;
              scores[winnerIdx]++;
              roundWinner = winnerIdx + 1;
              state = scores[winnerIdx] >= TARGET_WINS ? 'MATCH_OVER' : 'ROUND_OVER';
            } else {
              playSound('hit');
            }
          }
          updateHUD();
          break;
        }
      }
    }
  }

  // --- ÇİZİM DÖNGÜSÜ ---
  function drawGrid() {
    ctx.strokeStyle = 'rgba(30, 41, 59, 0.45)';
    ctx.lineWidth = 1;
    const step = 50;
    for (let x = step; x < W; x += step) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = step; y < H; y += step) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  function drawShip(p) {
    if (p.hp <= 0) return;
    if (p.invuln > 0 && Math.floor(p.invuln * 20) % 2 === 0) return;

    // İzi çiz
    if (p.trail.length > 1) {
      for (let i = 0; i < p.trail.length - 1; i++) {
        const alpha = (i / p.trail.length) * 0.35;
        ctx.strokeStyle = p.id === 1 ? `rgba(56,189,248,${alpha})` : `rgba(251,146,60,${alpha})`;
        ctx.lineWidth = (i / p.trail.length) * 6;
        ctx.beginPath();
        ctx.moveTo(p.trail[i].x, p.trail[i].y);
        ctx.lineTo(p.trail[i + 1].x, p.trail[i + 1].y);
        ctx.stroke();
      }
    }

    ctx.save();
    ctx.translate(p.x, p.y);

    // Mermi şarj noktaları (geminin altında)
    for (let i = 0; i < p.maxAmmo; i++) {
      ctx.fillStyle = i < p.ammo ? p.color : 'rgba(148, 163, 184, 0.25)';
      ctx.beginPath();
      ctx.arc((i - 1) * 9, p.radius + 12, 2.8, 0, Math.PI * 2);
      ctx.fill();
    }

    // Kalkan halkası
    if (p.shield) {
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#4ade80';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(0, 0, p.radius + 7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    ctx.rotate(p.angle);
    ctx.shadowColor = p.glow;
    ctx.shadowBlur = 14;
    ctx.fillStyle = p.color;
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 2;

    // Sivri üçgen/jet gemisi
    ctx.beginPath();
    ctx.moveTo(p.radius + 4, 0);
    ctx.lineTo(-p.radius + 2, -p.radius * 0.78);
    ctx.lineTo(-p.radius * 0.45, 0);
    ctx.lineTo(-p.radius + 2, p.radius * 0.78);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  function drawOverlay(title, subtitle, color = '#f8fafc') {
    ctx.fillStyle = 'rgba(7, 9, 19, 0.74)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.font = '800 44px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(title, W / 2, H / 2 - 24);

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#cbd5e1';
    ctx.font = '600 19px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(subtitle, W / 2, H / 2 + 24);

    ctx.fillStyle = '#94a3b8';
    ctx.font = '600 15px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('Başlamak / Devam Etmek için [SPACE] veya [ENTER] bas', W / 2, H / 2 + 72);
  }

  function render() {
    ctx.save();
    if (screenShake > 0) {
      const sx = (Math.random() - 0.5) * screenShake;
      const sy = (Math.random() - 0.5) * screenShake;
      ctx.translate(sx, sy);
    }

    ctx.clearRect(0, 0, W, H);
    drawGrid();

    // Bumperlar
    for (const b of bumpers) {
      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 0.55, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Poweruplar
    for (const pw of powerups) {
      const scale = 1 + Math.sin(pw.pulse) * 0.12;
      ctx.save();
      ctx.translate(pw.x, pw.y);
      ctx.scale(scale, scale);
      ctx.shadowColor = pw.color;
      ctx.shadowBlur = 14;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.strokeStyle = pw.color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, pw.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = pw.color;
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(pw.label, 0, 3.5);
      ctx.restore();
    }

    // Mermiler
    for (const b of bullets) {
      ctx.save();
      ctx.shadowColor = b.bounced ? '#ffffff' : b.color;
      ctx.shadowBlur = b.bounced ? 16 : 10;
      ctx.fillStyle = b.bounced ? '#ffffff' : b.color;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Gemiler
    for (const p of players) drawShip(p);

    // Parçacıklar
    for (const pt of particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Ekran durum yazıları
    if (state === 'MENU') {
      drawOverlay(
        'NEON DRIFT DÜELLOSU',
        '1. Oyuncu [W A S D]   vs   2. Oyuncu [OK TUŞLARI]',
        '#38bdf8'
      );
    } else if (state === 'ROUND_OVER') {
      const c = roundWinner === 1 ? '#38bdf8' : '#fb923c';
      drawOverlay(
        `${roundWinner}. OYUNCU TURU ALDI!`,
        `Skor: ${scores[0]} - ${scores[1]}`,
        c
      );
    } else if (state === 'MATCH_OVER') {
      const c = roundWinner === 1 ? '#38bdf8' : '#fb923c';
      drawOverlay(
        `ŞAMPİYON: ${roundWinner}. OYUNCU!`,
        `Final Skoru: ${scores[0]} - ${scores[1]} — Rövanş için hazır mısınız?`,
        c
      );
    }

    ctx.restore();
  }

  // --- ANA OYUN DÖNGÜSÜ ---
  resetRound();
  let lastTime = performance.now();

  function loop(now) {
    const dt = Math.min(0.04, (now - lastTime) / 1000);
    lastTime = now;

    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

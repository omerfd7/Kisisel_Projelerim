<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GERİ TEPME ARENASI — Recoil Survival</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #07090f;
      color: #e6edf7;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #121829 0%, #06080d 100%);
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 0 60px rgba(255, 72, 0, 0.14), 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      background: #0a0d16;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game" width="1120" height="680"></canvas>
  </div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      const W = canvas.width;
      const H = canvas.height;
      const LAVA_Y = H - 56;
      const STORAGE_KEY = 'recoil_arena_highscore_v1';

      // --- SES MOTORU (Web Audio API) ---
      const AudioEngine = {
        ctx: null,
        noiseBuffer: null,
        init() {
          if (this.ctx) {
            if (this.ctx.state === 'suspended') this.ctx.resume();
            return;
          }
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();

          // Patlama ve silah çatlağı için beyaz gürültü tamponu
          const bufferSize = this.ctx.sampleRate * 1.0;
          this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = this.noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
        },
        playShoot(pitchScale = 1) {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          // 1) Tok gövde darbesi (Punchy low-mid thump)
          const osc = this.ctx.createOscillator();
          const oscGain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(195 * pitchScale, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.11);

          oscGain.gain.setValueAtTime(0.38, now);
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

          osc.connect(oscGain);
          oscGain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.13);

          // 2) Barut patlaması / keskin klik (Filtered noise snap)
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1600 * pitchScale, now);
          filter.frequency.exponentialRampToValueAtTime(380, now + 0.08);
          filter.Q.value = 0.9;

          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.32, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);

          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(this.ctx.destination);
          noise.start(now);
          noise.stop(now + 0.09);
        },
        playDryFire() {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(980, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.03);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.04);
        },
        playHit(refilled = false) {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          // Tok isabet sesi
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(refilled ? 880 : 210, now + 0.08);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        },
        playExplosion(heavy = false) {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const dur = heavy ? 0.42 : 0.28;

          // Sub-bass darbe
          const osc = this.ctx.createOscillator();
          const oscGain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(heavy ? 115 : 140, now);
          osc.frequency.exponentialRampToValueAtTime(24, now + dur);
          oscGain.gain.setValueAtTime(heavy ? 0.34 : 0.24, now);
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          const lowpass = this.ctx.createBiquadFilter();
          lowpass.type = 'lowpass';
          lowpass.frequency.setValueAtTime(450, now);
          lowpass.frequency.exponentialRampToValueAtTime(80, now + dur);

          osc.connect(lowpass);
          lowpass.connect(oscGain);
          oscGain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + dur + 0.02);

          // Gürültü patlaması
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;
          const nFilter = this.ctx.createBiquadFilter();
          nFilter.type = 'lowpass';
          nFilter.frequency.setValueAtTime(heavy ? 1400 : 1900, now);
          nFilter.frequency.exponentialRampToValueAtTime(140, now + dur);

          const nGain = this.ctx.createGain();
          nGain.gain.setValueAtTime(heavy ? 0.38 : 0.26, now);
          nGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          noise.connect(nFilter);
          nFilter.connect(nGain);
          nGain.connect(this.ctx.destination);
          noise.start(now);
          noise.stop(now + dur + 0.02);
        },
        playLavaDeath() {
          if (!this.ctx) return;
          this.playExplosion(true);
          const now = this.ctx.currentTime;

          // Lav cızırtısı
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(1100, now);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);
          noise.stop(now + 0.56);
        }
      };

      // --- KONTROLLER ---
      const keys = {
        left: false,
        right: false,
        fire: false
      };
      let fireJustPressed = false;
      let startLockedUntil = 0;

      window.addEventListener('keydown', (e) => {
        const code = e.code;
        if (['ArrowLeft', 'ArrowRight', 'Space', 'Enter', 'KeyA', 'KeyD'].includes(code)) {
          e.preventDefault();
        }

        if (code === 'ArrowLeft' || code === 'KeyA') keys.left = true;
        if (code === 'ArrowRight' || code === 'KeyD') keys.right = true;

        if (code === 'Space') {
          if (!keys.fire) fireJustPressed = true;
          keys.fire = true;
        }

        if (code === 'Enter' || code === 'Space') {
          AudioEngine.init();
          if (state.mode !== 'PLAYING' && performance.now() > startLockedUntil) {
            startGame();
          }
        }
      }, { passive: false });

      window.addEventListener('keyup', (e) => {
        const code = e.code;
        if (code === 'ArrowLeft' || code === 'KeyA') keys.left = false;
        if (code === 'ArrowRight' || code === 'KeyD') keys.right = false;
        if (code === 'Space') keys.fire = false;
      });

      // --- OYUN DURUMU ---
      let highScore = Number(localStorage.getItem(STORAGE_KEY) || 0);

      const state = {
        mode: 'TITLE', // TITLE | PLAYING | GAMEOVER
        score: 0,
        kills: 0,
        combo: 1,
        comboTimer: 0,
        newRecord: false,
        elapsed: 0,
        shake: 0,
        hitStop: 0,
        spawnTimer: 0,
        graceTimer: 0,
        lavaTime: 0
      };

      const player = {
        x: W / 2,
        y: 210,
        vx: 0,
        vy: 0,
        radius: 17,
        angle: Math.PI / 2, // Başlangıçta namlu aşağı bakar -> ilk atış yukarı fırlatır
        rotSpeed: 4.5,
        energy: 100,
        maxEnergy: 100,
        fireCooldown: 0,
        timeSinceShot: 1,
        dryCooldown: 0,
        muzzleFlash: 0,
        recoilAnim: 0,
        emptyFlash: 0,
        energyGlow: 0,
        invuln: 0
      };

      const bullets = [];
      const enemyBullets = [];
      const enemies = [];
      const casings = [];
      const particles = [];
      const floatingTexts = [];
      const lavaEmbers = [];

      // Arka plan ızgara ve lav kıvılcımları
      for (let i = 0; i < 28; i++) {
        lavaEmbers.push({
          x: Math.random() * W,
          y: LAVA_Y + Math.random() * 40,
          vy: -18 - Math.random() * 38,
          vx: (Math.random() - 0.5) * 18,
          size: 1.5 + Math.random() * 2.5,
          alpha: 0.3 + Math.random() * 0.7
        });
      }

      function startGame() {
        state.mode = 'PLAYING';
        state.score = 0;
        state.kills = 0;
        state.combo = 1;
        state.comboTimer = 0;
        state.newRecord = false;
        state.elapsed = 0;
        state.shake = 0;
        state.hitStop = 0;
        state.spawnTimer = 0.25;
        state.graceTimer = 0.45; // Başlarken kısa denge süresi

        player.x = W / 2;
        player.y = 220;
        player.vx = 0;
        player.vy = -50;
        player.angle = Math.PI / 2; // Namlu aşağı -> ateş edince yukarı fırlar
        player.energy = 100;
        player.fireCooldown = 0.14; // Restart tuşuna basınca istemsiz ilk mermiyi engelle
        player.timeSinceShot = 1;
        player.dryCooldown = 0;
        player.muzzleFlash = 0;
        player.recoilAnim = 0;
        player.emptyFlash = 0;
        player.energyGlow = 0;
        player.invuln = 0.6;

        bullets.length = 0;
        enemyBullets.length = 0;
        enemies.length = 0;
        casings.length = 0;
        particles.length = 0;
        floatingTexts.length = 0;

        fireJustPressed = false;

        // İlk hedefleri hemen sahneye al
        spawnEnemy('chaser');
        spawnEnemy('chaser');
      }

      function triggerGameOver() {
        state.mode = 'GAMEOVER';
        startLockedUntil = performance.now() + 450;
        state.shake = 22;
        AudioEngine.playLavaDeath();

        // Lav patlama parçacıkları
        for (let i = 0; i < 48; i++) {
          const ang = -Math.PI * Math.random();
          const spd = 120 + Math.random() * 460;
          particles.push({
            x: player.x,
            y: LAVA_Y - 4,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            life: 0.4 + Math.random() * 0.65,
            maxLife: 1.05,
            size: 3 + Math.random() * 5,
            color: Math.random() < 0.5 ? '#ff5500' : '#ffd000',
            gravity: 680
          });
        }

        if (state.score > highScore) {
          highScore = state.score;
          state.newRecord = true;
          localStorage.setItem(STORAGE_KEY, String(highScore));
        }
      }

      // --- YARDIMCI FONKSİYONLAR ---
      function addFloatingText(x, y, text, color, scale = 1) {
        floatingTexts.push({
          x,
          y,
          vy: -55,
          text,
          color,
          scale,
          life: 0.85,
          maxLife: 0.85
        });
      }

      function spawnParticles(x, y, color, count, speed = 220, grav = 240, sizeBase = 3) {
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = (0.25 + Math.random() * 0.75) * speed;
          particles.push({
            x,
            y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            life: 0.25 + Math.random() * 0.45,
            maxLife: 0.7,
            size: sizeBase * (0.6 + Math.random() * 0.9),
            color,
            gravity: grav
          });
        }
      }

      // --- DÜŞMAN OLUŞTURMA ---
      function spawnEnemy(forcedType = null) {
        const diff = Math.min(1, state.elapsed / 75);
        let type = forcedType;
        if (!type) {
          const r = Math.random();
          if (state.elapsed > 18 && r < 0.18 + diff * 0.14) type = 'brute';
          else if (state.elapsed > 8 && r < 0.44 + diff * 0.16) type = 'shooter';
          else if (state.elapsed > 28 && r < 0.65) type = 'swarmer';
          else type = 'chaser';
        }

        // Kenarlardan veya üstten güvenli mesafede doğur
        let x, y;
        const edge = Math.random();
        if (edge < 0.38) {
          x = -30;
          y = 60 + Math.random() * (LAVA_Y - 170);
        } else if (edge < 0.76) {
          x = W + 30;
          y = 60 + Math.random() * (LAVA_Y - 170);
        } else {
          x = 80 + Math.random() * (W - 160);
          y = -30;
        }

        // Oyuncunun tam üstünde doğmasın
        if (Math.hypot(x - player.x, y - player.y) < 180) {
          x = player.x < W / 2 ? W - 40 : 40;
        }

        const speedScale = 1 + diff * 0.55;

        if (type === 'chaser') {
          enemies.push({
            type, x, y, vx: 0, vy: 0,
            radius: 17, hp: 1, maxHp: 1,
            speed: (118 + Math.random() * 28) * speedScale,
            score: 100, color: '#ff3b6b',
            flash: 0, angle: 0, shootTimer: 0
          });
        } else if (type === 'swarmer') {
          enemies.push({
            type, x, y, vx: 0, vy: 0,
            radius: 12, hp: 1, maxHp: 1,
            speed: (185 + Math.random() * 35) * speedScale,
            score: 130, color: '#ffb800',
            flash: 0, angle: 0, shootTimer: 0
          });
        } else if (type === 'shooter') {
          enemies.push({
            type, x, y, vx: 0, vy: 0,
            radius: 19, hp: 2, maxHp: 2,
            speed: (88 + Math.random() * 20) * speedScale,
            score: 200, color: '#a855f7',
            flash: 0, angle: 0, shootTimer: 1.3 + Math.random() * 1.1
          });
        } else if (type === 'brute') {
          enemies.push({
            type, x, y, vx: 0, vy: 0,
            radius: 27, hp: 4, maxHp: 4,
            speed: (68 + Math.random() * 16) * speedScale,
            score: 350, color: '#10b981',
            flash: 0, angle: 0, shootTimer: 0
          });
        }
      }

      // --- ATEŞ ETME VE GERİ TEPME MEKANİĞİ ---
      function attemptShoot(isSingleTap) {
        if (player.fireCooldown > 0) return;

        // Tekli kontrollü atışlarda daha düşük enerji maliyeti, taramada yüksek maliyet
        const isPrecisionTap = isSingleTap || player.timeSinceShot > 0.24;
        const cost = isPrecisionTap ? 13 : 19;

        if (player.energy < cost) {
          if (player.dryCooldown <= 0) {
            AudioEngine.playDryFire();
            player.dryCooldown = 0.16;
            player.emptyFlash = 0.28;
            addFloatingText(player.x, player.y - 30, 'ENERJİ BİTTİ!', '#ff4d4d', 0.9);
          }
          return;
        }

        player.energy = Math.max(0, player.energy - cost);
        player.fireCooldown = 0.125;
        player.timeSinceShot = 0;
        player.muzzleFlash = 0.065;
        player.recoilAnim = 1;

        const dirX = Math.cos(player.angle);
        const dirY = Math.sin(player.angle);
        const muzzleDist = player.radius + 17;
        const mx = player.x + dirX * muzzleDist;
        const my = player.y + dirY * muzzleDist;

        // Mermi oluştur
        const spread = isPrecisionTap ? 0.015 : 0.09;
        const shotAngle = player.angle + (Math.random() - 0.5) * spread;
        const bSpeed = 1220;

        bullets.push({
          x: mx,
          y: my,
          prevX: mx,
          prevY: my,
          vx: Math.cos(shotAngle) * bSpeed,
          vy: Math.sin(shotAngle) * bSpeed,
          radius: 4.5,
          life: 1.2,
          precise: isPrecisionTap
        });

        // FİZİKSEL GERİ TEPME (Tam ters yöne itiş)
        const recoilImpulse = 305;
        player.vx -= dirX * recoilImpulse;
        player.vy -= dirY * recoilImpulse;

        // Aşırı hızlanmayı yumuşak sınırla
        const spd = Math.hypot(player.vx, player.vy);
        const maxSpd = 760;
        if (spd > maxSpd) {
          player.vx = (player.vx / spd) * maxSpd;
          player.vy = (player.vy / spd) * maxSpd;
        }

        // Namlu dumanı / geri tepme kıvılcımları
        for (let i = 0; i < 6; i++) {
          const sAng = player.angle + (Math.random() - 0.5) * 0.7;
          const sSpd = 120 + Math.random() * 240;
          particles.push({
            x: mx,
            y: my,
            vx: Math.cos(sAng) * sSpd,
            vy: Math.sin(sAng) * sSpd,
            life: 0.12 + Math.random() * 0.12,
            maxLife: 0.24,
            size: 2 + Math.random() * 2.5,
            color: Math.random() < 0.5 ? '#fff3b0' : '#ff9100',
            gravity: 100
          });
        }

        // Mermi kovanı fırlatma
        const ejectSide = player.angle - Math.PI / 2;
        const ejectAngle = ejectSide + (Math.random() - 0.5) * 0.5;
        const ejectSpeed = 130 + Math.random() * 110;
        casings.push({
          x: player.x + dirX * 10,
          y: player.y + dirY * 10,
          vx: player.vx * 0.35 + Math.cos(ejectAngle) * ejectSpeed,
          vy: player.vy * 0.35 + Math.sin(ejectAngle) * ejectSpeed - 65,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 22,
          life: 2.2
        });

        state.shake = Math.max(state.shake, 5.5);
        AudioEngine.playShoot(0.95 + Math.random() * 0.12);
      }

      // --- GÜNCELLEME DÖNGÜSÜ ---
      function update(dt) {
        state.lavaTime += dt;

        // Lav kıvılcımları her ekranda animasyonlu olsun
        for (const e of lavaEmbers) {
          e.x += e.vx * dt;
          e.y += e.vy * dt;
          if (e.y < LAVA_Y - 70) {
            e.x = Math.random() * W;
            e.y = LAVA_Y + 12 + Math.random() * 20;
          }
        }

        // Parçacık güncellemesi (Game Over ekranında da aksın)
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.vy += p.gravity * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) particles.splice(i, 1);
        }

        // Kovan güncellemesi
        for (let i = casings.length - 1; i >= 0; i--) {
          const c = casings[i];
          c.vy += 680 * dt;
          c.x += c.vx * dt;
          c.y += c.vy * dt;
          c.rot += c.vRot * dt;
          c.life -= dt;

          // Duvarlardan hafif sekme
          if (c.x < 4 || c.x > W - 4) {
            c.vx *= -0.5;
            c.x = Math.max(4, Math.min(W - 4, c.x));
          }
          // Lava düşünce küçük cızırtı kıvılcımı
          if (c.y >= LAVA_Y - 2) {
            spawnParticles(c.x, LAVA_Y - 3, '#ff8800', 2, 70, 260, 2);
            casings.splice(i, 1);
            continue;
          }
          if (c.life <= 0) casings.splice(i, 1);
        }

        // Yüzen yazılar
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.y += ft.vy * dt;
          ft.vy *= 0.94;
          ft.life -= dt;
          if (ft.life <= 0) floatingTexts.splice(i, 1);
        }

        // Ekran sarsıntısı sönümlemesi
        state.shake = Math.max(0, state.shake - 42 * dt);

        if (state.mode !== 'PLAYING') return;

        // Vuruş duraklaması (Hit-stop hissi)
        if (state.hitStop > 0) {
          state.hitStop -= dt;
          return;
        }

        state.elapsed += dt;
        if (state.graceTimer > 0) state.graceTimer -= dt;
        if (player.invuln > 0) player.invuln -= dt;

        // Kombo sayacı
        if (state.combo > 1) {
          state.comboTimer -= dt;
          if (state.comboTimer <= 0) state.combo = 1;
        }

        // Oyuncu eksen dönüşü (Sadece Sol/Sağ veya A/D)
        if (keys.left) player.angle -= player.rotSpeed * dt;
        if (keys.right) player.angle += player.rotSpeed * dt;

        // Ateş zamanlayıcıları
        player.fireCooldown = Math.max(0, player.fireCooldown - dt);
        player.dryCooldown = Math.max(0, player.dryCooldown - dt);
        player.muzzleFlash = Math.max(0, player.muzzleFlash - dt);
        player.recoilAnim = Math.max(0, player.recoilAnim - dt * 8);
        player.emptyFlash = Math.max(0, player.emptyFlash - dt);
        player.energyGlow = Math.max(0, player.energyGlow - dt);
        player.timeSinceShot += dt;

        // Ateş kontrolü
        if (fireJustPressed || keys.fire) {
          attemptShoot(fireJustPressed);
          fireJustPressed = false;
        }

        // Sürekli taramazsan (0.42sn ateş etmezsen) yavaşça enerji toparlanır
        // Ancak isabetli vuruşlar enerjiyi ANINDA doldurur!
        if (player.timeSinceShot > 0.42 && player.energy < player.maxEnergy) {
          player.energy = Math.min(player.maxEnergy, player.energy + 22 * dt);
        }

        // Yerçekimi ve hava direnci
        const gravity = state.graceTimer > 0 ? 150 : 430;
        player.vy += gravity * dt;
        player.vx *= Math.pow(0.55, dt);
        player.vy *= Math.pow(0.75, dt);

        player.x += player.vx * dt;
        player.y += player.vy * dt;

        // Duvar ve tavan sekmeleri
        if (player.x < player.radius) {
          player.x = player.radius;
          player.vx = Math.abs(player.vx) * 0.65;
          spawnParticles(player.x - player.radius, player.y, '#38bdf8', 4, 130, 180, 2);
        } else if (player.x > W - player.radius) {
          player.x = W - player.radius;
          player.vx = -Math.abs(player.vx) * 0.65;
          spawnParticles(player.x + player.radius, player.y, '#38bdf8', 4, 130, 180, 2);
        }

        if (player.y < player.radius) {
          player.y = player.radius;
          player.vy = Math.abs(player.vy) * 0.55;
          spawnParticles(player.x, player.y - player.radius, '#38bdf8', 4, 130, 180, 2);
        }

        // Lav ve diken zemin kontrolü
        if (player.y + player.radius >= LAVA_Y - 6) {
          triggerGameOver();
          return;
        }

        // Düşman doğurma temposu
        state.spawnTimer -= dt;
        const maxEnemies = Math.min(13, 3 + Math.floor(state.elapsed / 7));
        if (state.spawnTimer <= 0 && enemies.length < maxEnemies) {
          spawnEnemy();
          const interval = Math.max(0.55, 1.85 - state.elapsed * 0.018);
          state.spawnTimer = interval * (0.75 + Math.random() * 0.5);
        }

        // Mermileri güncelle
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.prevX = b.x;
          b.prevY = b.y;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.life -= dt;

          // Sınır veya lav kontrolü
          if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y >= LAVA_Y || b.life <= 0) {
            if (b.y >= LAVA_Y) {
              spawnParticles(b.x, LAVA_Y - 2, '#ff7b00', 4, 110, 300, 2);
            }
            bullets.splice(i, 1);
            continue;
          }

          // Düşman çarpışma testi
          let hit = false;
          for (let j = enemies.length - 1; j >= 0; j--) {
            const en = enemies[j];
            const dist = Math.hypot(b.x - en.x, b.y - en.y);
            if (dist <= en.radius + b.radius + 3) {
              hit = true;
              en.hp -= 1;
              en.flash = 0.11;

              // Düşmanı hafif geri it
              const bLen = Math.hypot(b.vx, b.vy) || 1;
              en.vx += (b.vx / bLen) * 140;
              en.vy += (b.vy / bLen) * 140;

              // USTALAŞMA MEKANİĞİ: İsabetli atış veya düşman vurma enerjiyi ANINDA doldurur!
              const prevEnergy = player.energy;
              if (en.hp <= 0 || b.precise) {
                player.energy = player.maxEnergy;
              } else {
                player.energy = Math.min(player.maxEnergy, player.energy + 55);
              }
              if (player.energy > prevEnergy) {
                player.energyGlow = 0.35;
              }

              spawnParticles(b.x, b.y, '#ffffff', 6, 220, 120, 2.5);

              if (en.hp <= 0) {
                // Düşman imha edildi
                state.kills += 1;
                state.combo = Math.min(8, state.combo + 1);
                state.comboTimer = 3.2;
                const gained = en.score * state.combo;
                state.score += gained;

                state.shake = Math.max(state.shake, en.type === 'brute' ? 14 : 9);
                state.hitStop = en.type === 'brute' ? 0.032 : 0.014;
                AudioEngine.playExplosion(en.type === 'brute');

                spawnParticles(en.x, en.y, en.color, en.type === 'brute' ? 28 : 18, 320, 220, 4);
                spawnParticles(en.x, en.y, '#ffffff', 8, 220, 120, 2.5);

                const comboTag = state.combo > 1 ? ` x${state.combo}` : '';
                addFloatingText(en.x, en.y - 12, `+${gained}${comboTag}`, '#38bdf8', 1.05);
                if (prevEnergy < 65) {
                  addFloatingText(player.x, player.y - 34, 'ENERJİ DOLDU!', '#4ade80', 0.85);
                }

                enemies.splice(j, 1);
              } else {
                AudioEngine.playHit(true);
                state.shake = Math.max(state.shake, 4.5);
                if (prevEnergy < 75) {
                  addFloatingText(player.x, player.y - 32, '+ENERJİ', '#4ade80', 0.8);
                }
              }
              break;
            }
          }

          if (hit) bullets.splice(i, 1);
        }

        // Düşman mermileri
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
          const eb = enemyBullets[i];
          eb.x += eb.vx * dt;
          eb.y += eb.vy * dt;
          eb.life -= dt;

          if (eb.x < -20 || eb.x > W + 20 || eb.y < -20 || eb.y >= LAVA_Y || eb.life <= 0) {
            enemyBullets.splice(i, 1);
            continue;
          }

          if (player.invuln <= 0 && Math.hypot(eb.x - player.x, eb.y - player.y) < player.radius + eb.radius - 2) {
            triggerGameOver();
            return;
          }
        }

        // Düşmanları güncelle
        for (let i = enemies.length - 1; i >= 0; i--) {
          const en = enemies[i];
          if (en.flash > 0) en.flash -= dt;

          const dx = player.x - en.x;
          const dy = player.y - en.y;
          const dist = Math.hypot(dx, dy) || 1;
          en.angle = Math.atan2(dy, dx);

          let targetVx = (dx / dist) * en.speed;
          let targetVy = (dy / dist) * en.speed;

          // Nişancı düşman orta mesafede durup enerji küresi atar
          if (en.type === 'shooter') {
            if (dist < 240) {
              targetVx *= -0.35;
              targetVy *= -0.35;
            }
            en.shootTimer -= dt;
            if (en.shootTimer <= 0 && en.x > 20 && en.x < W - 20 && en.y > 20) {
              en.shootTimer = 2.1 + Math.random() * 0.9;
              const bSpd = 265;
              enemyBullets.push({
                x: en.x + (dx / dist) * en.radius,
                y: en.y + (dy / dist) * en.radius,
                vx: (dx / dist) * bSpd,
                vy: (dy / dist) * bSpd,
                radius: 6.5,
                life: 4
              });
              spawnParticles(en.x, en.y, '#c084fc', 5, 110, 0, 2.5);
            }
          }

          en.vx += (targetVx - en.vx) * Math.min(1, 3.2 * dt);
          en.vy += (targetVy - en.vy) * Math.min(1, 3.2 * dt);
          en.x += en.vx * dt;
          en.y += en.vy * dt;

          // Düşmanlar lavın üstünde uçsun
          if (en.y > LAVA_Y - en.radius - 16) {
            en.y = LAVA_Y - en.radius - 16;
            en.vy = -Math.abs(en.vy) * 0.4;
          }

          // Oyuncu ile çarpışma
          if (player.invuln <= 0 && Math.hypot(en.x - player.x, en.y - player.y) < player.radius + en.radius - 3) {
            triggerGameOver();
            return;
          }
        }
      }

      // --- ÇİZİM FONKSİYONLARI ---
      function drawBackground() {
        // Koyu arena arka planı
        ctx.fillStyle = '#0a0e17';
        ctx.fillRect(0, 0, W, H);

        // Hafif endüstriyel ızgara
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.05)';
        ctx.lineWidth = 1;
        const gridSize = 56;
        for (let x = gridSize; x < W; x += gridSize) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, LAVA_Y);
          ctx.stroke();
        }
        for (let y = gridSize; y < LAVA_Y; y += gridSize) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }

        // Lavdan yukarı yansıyan sıcak ışık
        const lavaGlow = ctx.createLinearGradient(0, LAVA_Y - 190, 0, LAVA_Y);
        lavaGlow.addColorStop(0, 'rgba(255, 68, 0, 0)');
        lavaGlow.addColorStop(1, 'rgba(255, 68, 0, 0.24)');
        ctx.fillStyle = lavaGlow;
        ctx.fillRect(0, LAVA_Y - 190, W, 190);

        // Arena kenar enerji çerçevesi
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.22)';
        ctx.lineWidth = 3;
        ctx.strokeRect(1.5, 1.5, W - 3, LAVA_Y);
      }

      function drawLavaAndSpikes() {
        // Arka dikenler (metalik obsidian)
        const spikeW = 28;
        ctx.fillStyle = '#1d1218';
        ctx.strokeStyle = '#ff4d00';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let x = 0; x <= W; x += spikeW) {
          ctx.moveTo(x, LAVA_Y + 8);
          ctx.lineTo(x + spikeW * 0.5, LAVA_Y - 11);
          ctx.lineTo(x + spikeW, LAVA_Y + 8);
        }
        ctx.fill();
        ctx.stroke();

        // Dalgalı kızgın lav yüzeyi
        const lavaGrad = ctx.createLinearGradient(0, LAVA_Y, 0, H);
        lavaGrad.addColorStop(0, '#ff8800');
        lavaGrad.addColorStop(0.22, '#ff3300');
        lavaGrad.addColorStop(1, '#7a0b00');

        ctx.fillStyle = lavaGrad;
        ctx.beginPath();
        ctx.moveTo(0, H);
        for (let x = 0; x <= W; x += 16) {
          const wave = Math.sin(x * 0.03 + state.lavaTime * 4.2) * 3.5 +
                       Math.cos(x * 0.07 - state.lavaTime * 2.8) * 2;
          ctx.lineTo(x, LAVA_Y + wave);
        }
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();

        // Parlak üst lav kabuğu
        ctx.strokeStyle = '#ffd000';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let x = 0; x <= W; x += 16) {
          const wave = Math.sin(x * 0.03 + state.lavaTime * 4.2) * 3.5 +
                       Math.cos(x * 0.07 - state.lavaTime * 2.8) * 2;
          if (x === 0) ctx.moveTo(x, LAVA_Y + wave);
          else ctx.lineTo(x, LAVA_Y + wave);
        }
        ctx.stroke();

        // Yükselen lav kıvılcımları
        for (const e of lavaEmbers) {
          ctx.fillStyle = `rgba(255, 200, 60, ${e.alpha})`;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawPlayer() {
        if (state.mode === 'GAMEOVER') return;

        ctx.save();
        ctx.translate(player.x, player.y);

        // Nişangah lazer çizgisi
        ctx.save();
        ctx.rotate(player.angle);
        const aimGrad = ctx.createLinearGradient(22, 0, 260, 0);
        aimGrad.addColorStop(0, 'rgba(56, 189, 248, 0.45)');
        aimGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
        ctx.strokeStyle = aimGrad;
        ctx.setLineDash([7, 7]);
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(26, 0);
        ctx.lineTo(260, 0);
        ctx.stroke();
        ctx.restore();

        // Enerji halkası (Karakterin üzerinde doğrudan şarjör göstergesi)
        const ratio = player.energy / player.maxEnergy;
        const ringColor = player.emptyFlash > 0
          ? '#ff3b3b'
          : player.energyGlow > 0
            ? '#4ade80'
            : ratio < 0.25
              ? '#fb923c'
              : '#38bdf8';

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, player.radius + 7, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = ringColor;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, 0, player.radius + 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ratio);
        ctx.stroke();

        // Silah ve gövde dönüşü
        ctx.rotate(player.angle);

        // Geri tepme animasyon kayması
        const kick = player.recoilAnim * 6;

        // Namlu patlaması (Muzzle flash)
        if (player.muzzleFlash > 0) {
          const flashAlpha = player.muzzleFlash / 0.065;
          ctx.save();
          ctx.translate(player.radius + 21 - kick, 0);
          ctx.fillStyle = `rgba(255, 235, 130, ${flashAlpha})`;
          ctx.beginPath();
          ctx.moveTo(0, -10);
          ctx.lineTo(32, 0);
          ctx.lineTo(0, 10);
          ctx.lineTo(-4, 0);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
          ctx.beginPath();
          ctx.arc(4, 0, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Ağır top namlusu
        ctx.fillStyle = '#334155';
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.5;
        ctx.fillRect(4 - kick, -6.5, 29, 13);
        ctx.strokeRect(4 - kick, -6.5, 29, 13);

        // Namlu ucu ağzı
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(28 - kick, -7.5, 6, 15);
        ctx.strokeRect(28 - kick, -7.5, 6, 15);

        // Oyuncu çekirdek gövdesi
        ctx.fillStyle = player.invuln > 0 && Math.floor(state.elapsed * 20) % 2 === 0 ? '#ffffff' : '#0f172a';
        ctx.strokeStyle = ringColor;
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Çekirdek enerji gözü
        ctx.fillStyle = ringColor;
        ctx.beginPath();
        ctx.arc(3, 0, 6.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawEnemies() {
        for (const en of enemies) {
          ctx.save();
          ctx.translate(en.x, en.y);
          ctx.rotate(en.angle);

          const fill = en.flash > 0 ? '#ffffff' : en.color;

          if (en.type === 'chaser') {
            // Sivri avcı dron
            ctx.fillStyle = '#181826';
            ctx.strokeStyle = fill;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(en.radius + 4, 0);
            ctx.lineTo(-en.radius, -en.radius * 0.85);
            ctx.lineTo(-en.radius * 0.45, 0);
            ctx.lineTo(-en.radius, en.radius * 0.85);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = fill;
            ctx.beginPath();
            ctx.arc(2, 0, 4.5, 0, Math.PI * 2);
            ctx.fill();
          } else if (en.type === 'swarmer') {
            // Hızlı üçgen
            ctx.fillStyle = fill;
            ctx.beginPath();
            ctx.moveTo(en.radius + 3, 0);
            ctx.lineTo(-en.radius, -en.radius * 0.8);
            ctx.lineTo(-en.radius, en.radius * 0.8);
            ctx.closePath();
            ctx.fill();
          } else if (en.type === 'shooter') {
            // Plazma nişancısı (Elmas)
            ctx.fillStyle = '#1b1129';
            ctx.strokeStyle = fill;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(en.radius + 2, 0);
            ctx.lineTo(0, -en.radius);
            ctx.lineTo(-en.radius, 0);
            ctx.lineTo(0, en.radius);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = fill;
            ctx.beginPath();
            ctx.arc(0, 0, 6, 0, Math.PI * 2);
            ctx.fill();
          } else if (en.type === 'brute') {
            // Zırhlı altıgen dev
            ctx.fillStyle = '#0e241d';
            ctx.strokeStyle = fill;
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let k = 0; k < 6; k++) {
              const a = (Math.PI * 2 * k) / 6;
              const px = Math.cos(a) * en.radius;
              const py = Math.sin(a) * en.radius;
              if (k === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Zırh can çubuğu
            ctx.rotate(-en.angle);
            const barW = 36;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(-barW / 2, -en.radius - 12, barW, 5);
            ctx.fillStyle = fill;
            ctx.fillRect(-barW / 2, -en.radius - 12, barW * (en.hp / en.maxHp), 5);
          }

          ctx.restore();
        }
      }

      function drawProjectilesAndEffects() {
        // Mermi kovanları
        for (const c of casings) {
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rot);
          ctx.fillStyle = '#eab308';
          ctx.fillRect(-3.5, -1.6, 7, 3.2);
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(-2, -1.2, 4, 1.2);
          ctx.restore();
        }

        // Oyuncu mermileri
        for (const b of bullets) {
          ctx.strokeStyle = b.precise ? '#fef08a' : '#fb923c';
          ctx.lineWidth = b.precise ? 4 : 3;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(b.prevX - b.vx * 0.015, b.prevY - b.vy * 0.015);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Düşman enerji topları
        for (const eb of enemyBullets) {
          ctx.fillStyle = '#c084fc';
          ctx.beginPath();
          ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(eb.x, eb.y, eb.radius * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }

        // Parçacıklar
        for (const p of particles) {
          const alpha = Math.max(0, p.life / p.maxLife);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Yüzen puan ve enerji yazıları
        for (const ft of floatingTexts) {
          const alpha = Math.max(0, ft.life / ft.maxLife);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.font = `700 ${Math.round(15 * ft.scale)}px "Segoe UI", sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        }
      }

      function drawHUD() {
        // Skor ve Rekor (Sol Üst)
        ctx.textAlign = 'left';
        ctx.font = '800 28px "Segoe UI", sans-serif';
        ctx.fillStyle = '#f8fafc';
        ctx.fillText(`${state.score}`, 22, 40);

        ctx.font = '600 13px "Segoe UI", sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(`REKOR: ${highScore}`, 22, 60);

        if (state.combo > 1) {
          ctx.font = '800 18px "Segoe UI", sans-serif';
          ctx.fillStyle = '#38bdf8';
          ctx.fillText(`KOMBO x${state.combo}`, 22, 84);
        }

        // Şarjör / Enerji Barı (Üst Orta)
        const barW = 280;
        const barH = 14;
        const barX = (W - barW) / 2;
        const barY = 22;
        const ratio = player.energy / player.maxEnergy;

        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.fillRect(barX, barY, barW, barH);
        ctx.strokeRect(barX, barY, barW, barH);

        const barColor = player.emptyFlash > 0
          ? '#ef4444'
          : player.energyGlow > 0
            ? '#4ade80'
            : ratio < 0.25
              ? '#f97316'
              : '#38bdf8';

        ctx.fillStyle = barColor;
        ctx.fillRect(barX + 2, barY + 2, (barW - 4) * ratio, barH - 4);

        ctx.textAlign = 'center';
        ctx.font = '700 11px "Segoe UI", sans-serif';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText('ŞARJÖR ENERJİSİ  (İsabet = Anında Dolum)', W / 2, barY + 30);

        // Sağ Üst Hayatta Kalma Süresi & İmha
        ctx.textAlign = 'right';
        ctx.font = '700 16px "Segoe UI", sans-serif';
        ctx.fillStyle = '#e2e8f0';
        ctx.fillText(`İMHA: ${state.kills}`, W - 22, 36);
        ctx.font = '600 13px "Segoe UI", sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(`SÜRE: ${state.elapsed.toFixed(1)}s`, W - 22, 56);
      }

      function drawOverlays() {
        if (state.mode === 'PLAYING') return;

        ctx.fillStyle = 'rgba(7, 10, 18, 0.72)';
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = 'center';

        if (state.mode === 'TITLE') {
          ctx.font = '900 50px "Segoe UI", sans-serif';
          ctx.fillStyle = '#f8fafc';
          ctx.fillText('GERİ TEPME ARENASI', W / 2, 190);

          ctx.font = '700 17px "Segoe UI", sans-serif';
          ctx.fillStyle = '#ff7b00';
          ctx.fillText('HAREKET ETMEK İÇİN ATEŞ ET • YERE DÜŞERSEN YANARSIN', W / 2, 232);

          // Bilgi kartı
          ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
          ctx.lineWidth = 1.5;
          ctx.fillRect(W / 2 - 285, 268, 570, 175);
          ctx.strokeRect(W / 2 - 285, 268, 570, 175);

          ctx.font = '600 16px "Segoe UI", sans-serif';
          ctx.fillStyle = '#e2e8f0';
          ctx.fillText('← / →  veya  A / D  :  Kendi ekseninde dön', W / 2, 308);
          ctx.fillText('SPACE  :  Ateş et ve ters yöne fırlat (Geri Tepme)', W / 2, 342);

          ctx.fillStyle = '#4ade80';
          ctx.fillText('USTALIK KURALI: Sürekli tararsan enerjin biter ve düşersin.', W / 2, 386);
          ctx.fillStyle = '#38bdf8';
          ctx.fillText('İsabetli tek atışlar veya düşman vurmak enerjini ANINDA doldurur!', W / 2, 414);

          if (highScore > 0) {
            ctx.font = '700 16px "Segoe UI", sans-serif';
            ctx.fillStyle = '#fbbf24';
            ctx.fillText(`EN YÜKSEK SKOR: ${highScore}`, W / 2, 488);
          }

          const pulse = 0.65 + 0.35 * Math.sin(state.lavaTime * 5);
          ctx.font = '800 22px "Segoe UI", sans-serif';
          ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
          ctx.fillText('BAŞLAMAK İÇİN [ ENTER ] VEYA [ SPACE ] TUŞUNA BAS', W / 2, 545);
        } else if (state.mode === 'GAMEOVER') {
          ctx.font = '900 54px "Segoe UI", sans-serif';
          ctx.fillStyle = '#ff4d4d';
          ctx.fillText('KÜL OLDUN!', W / 2, 200);

          if (state.newRecord) {
            ctx.font = '800 22px "Segoe UI", sans-serif';
            ctx.fillStyle = '#fbbf24';
            ctx.fillText('★ YENİ YÜKSEK SKOR! ★', W / 2, 244);
          }

          ctx.font = '800 36px "Segoe UI", sans-serif';
          ctx.fillStyle = '#f8fafc';
          ctx.fillText(`SKOR: ${state.score}`, W / 2, 305);

          ctx.font = '600 18px "Segoe UI", sans-serif';
          ctx.fillStyle = '#94a3b8';
          ctx.fillText(`İMHA: ${state.kills}   •   SÜRE: ${state.elapsed.toFixed(1)}s   •   REKOR: ${highScore}`, W / 2, 345);

          const pulse = 0.65 + 0.35 * Math.sin(state.lavaTime * 5);
          ctx.font = '800 21px "Segoe UI", sans-serif';
          ctx.fillStyle = `rgba(56, 189, 248, ${pulse})`;
          ctx.fillText('TEKRAR OYNAMAK İÇİN [ ENTER ] VEYA [ SPACE ]', W / 2, 435);
        }
      }

      function render() {
        ctx.save();

        // Ekran sarsıntısı uygula
        if (state.shake > 0.2) {
          const sx = (Math.random() - 0.5) * state.shake * 1.4;
          const sy = (Math.random() - 0.5) * state.shake * 1.4;
          ctx.translate(sx, sy);
        }

        drawBackground();
        drawProjectilesAndEffects();
        drawEnemies();
        drawPlayer();
        drawLavaAndSpikes();

        ctx.restore();

        if (state.mode === 'PLAYING') {
          drawHUD();
        }
        drawOverlays();
      }

      // --- ANA OYUN DÖNGÜSÜ ---
      let lastTime = performance.now();
      function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>

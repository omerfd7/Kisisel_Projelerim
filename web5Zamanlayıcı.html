<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zamanlayıcı</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: #f8fafc;
      background: #0f172a;
    }

    .timer {
      width: min(90vw, 420px);
      padding: 32px;
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      box-shadow: 0 20px 60px #0005;
    }

    h1 { margin: 0 0 24px; }

    .display {
      margin: 16px 0 24px;
      font-size: clamp(3.5rem, 18vw, 6rem);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .inputs {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    input {
      width: 88px;
      padding: 12px;
      color: #f8fafc;
      font: inherit;
      font-size: 1.1rem;
      text-align: center;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 10px;
    }

    .buttons { display: flex; gap: 10px; }

    button {
      flex: 1;
      padding: 12px 16px;
      color: white;
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }
    #start { background: #2563eb; }
    #pause { background: #475569; }
    #reset { background: #dc2626; }
    #status { min-height: 1.5em; margin: 18px 0 0; color: #cbd5e1; }
  </style>
</head>
<body>
  <main class="timer">
    <h1>Zamanlayıcı</h1>

    <div class="inputs">
      <label>
        <input id="minutes" type="number" min="0" max="999" value="5" aria-label="Dakika">
        dk
      </label>
      <span>:</span>
      <label>
        <input id="seconds" type="number" min="0" max="59" value="0" aria-label="Saniye">
        sn
      </label>
    </div>

    <div class="display" id="display" role="timer" aria-live="off">05:00</div>

    <div class="buttons">
      <button id="start">Başlat</button>
      <button id="pause" disabled>Duraklat</button>
      <button id="reset">Sıfırla</button>
    </div>

    <p id="status" aria-live="polite">Süreyi ayarlayın.</p>
  </main>

  <script>
    const minutesInput = document.getElementById("minutes");
    const secondsInput = document.getElementById("seconds");
    const display = document.getElementById("display");
    const status = document.getElementById("status");
    const startButton = document.getElementById("start");
    const pauseButton = document.getElementById("pause");
    const resetButton = document.getElementById("reset");

    let remaining = 300;
    let interval = null;

    function getInputTime() {
      const minutes = Math.max(0, Number(minutesInput.value) || 0);
      const seconds = Math.min(59, Math.max(0, Number(secondsInput.value) || 0));
      return minutes * 60 + seconds;
    }

    function render() {
      const mins = Math.floor(remaining / 60);
      const secs = remaining % 60;
      display.textContent =
        `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function finish() {
      clearInterval(interval);
      interval = null;
      startButton.disabled = false;
      pauseButton.disabled = true;
      status.textContent = "Süre doldu!";
      document.title = "Süre doldu!";
      alert("Süre doldu!");
    }

    startButton.addEventListener("click", () => {
      if (interval) return;

      if (remaining <= 0) remaining = getInputTime();
      if (remaining <= 0) {
        status.textContent = "Lütfen sıfırdan büyük bir süre girin.";
        return;
      }

      render();
      interval = setInterval(() => {
        remaining--;
        render();
        document.title = `${display.textContent} — Zamanlayıcı`;

        if (remaining <= 0) finish();
      }, 1000);

      startButton.disabled = true;
      pauseButton.disabled = false;
      status.textContent = "Zamanlayıcı çalışıyor.";
    });

    pauseButton.addEventListener("click", () => {
      clearInterval(interval);
      interval = null;
      startButton.disabled = false;
      pauseButton.disabled = true;
      status.textContent = "Duraklatıldı.";
    });

    resetButton.addEventListener("click", () => {
      clearInterval(interval);
      interval = null;
      remaining = getInputTime();
      render();
      startButton.disabled = false;
      pauseButton.disabled = true;
      status.textContent = "Süre sıfırlandı.";
      document.title = "Zamanlayıcı";
    });

    [minutesInput, secondsInput].forEach(input => {
      input.addEventListener("input", () => {
        if (!interval) {
          remaining = getInputTime();
          render();
        }
      });
    });

    render();
  </script>
</body>
</html>
